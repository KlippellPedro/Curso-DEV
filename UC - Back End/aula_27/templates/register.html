<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {font-family: Arial, Helvetica, sans-serif; text-align: center;}
        input,button {margin: 5px; padding: 10px;}
    </style>
</head>
<body>
    <h2>Cadastro</h2>
    <form method="post">
        Nome: <input type="text" name="nome" placeholder="Pedro Klippel" required><br>
        Email: <input type="email" name="email" placeholder="teste@gmail.com" required><br>
        Senha: <input type="password" name="senha" placeholder="MinhaSenha1234"><br>
        <button type="submit">Cadastrar</button>
    </form>
    <a href="/login">Login</a>
</body>
</html>
