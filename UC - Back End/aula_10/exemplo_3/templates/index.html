<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de notas</title>
</head>

<body>
    <h2>Sistema de notas, utilizando lista(Array)</h2>
    <form action="/calcular" method="post">
        <label>Nome do aluno: <input type="text" name="nome" required></label><br>
        <label>Turma: <input type="text" name="turma" required></label><br>
        <label>Primeira nota: <input type="number" name="nota1" step="0.1"></label><br>
        <label>Segunda nota: <input type="number" name="nota2" step="0.1"></label><br>
        <label>Terceira nota: <input type="number" name="nota3" step="0.1"></label><br>
        <label>Quarta nota: <input type="number" name="nota4" step="0.1"></label><br>
        <label>Quinta nota: <input type="number" name="nota5" step="0.1"></label><br>
        <button type="submit">Calcular média</button>
    </form>
</body>

</html>
