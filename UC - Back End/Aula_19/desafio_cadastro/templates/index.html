<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1>Cadastrar cliente</h1>
    <form method="post" action="/cadastrar">
        <input type="text" name="nome" placeholder="Nome" required> <br>
        <input type="text" name="sobrenome" placeholder="Sobrenome" required> <br>
        <input type="text" name="endereco" placeholder="Endereço" required> <br>
        <input type="number" name="numero" placeholder="Numero" required> <br>
        <input type="text" name="comple" placeholder="Complemento" required> <br>
        <input type="text" name="bairro" placeholder="Bairro" required> <br>
        <input type="text" name="cidade" placeholder="Cidade" required> <br>
        <input type="text" name="estado" placeholder="Estado" required> <br>
        <input type="date" name="data_nasc" required> <br>
        <input type="text" name="cpf" placeholder="CPF" required> <br>
        <input type="text" name="rg" placeholder="RG" required> <br>
        <input type="email" name="email" placeholder="E-mail" required> <br>
        <input type="tel" name="telefone" placeholder="Telefone" required> <br>
        <input type="submit" value="Cadastrar" />
    </form>
    <br />
    <hr />
    <!-- Botão para listar os contatos gravados no banco-->
     <a href="/listar">
        <button type="button">Ver cadastros dos clientes</button>
     </a>
    
</body>
</html>
